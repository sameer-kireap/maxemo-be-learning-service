services:
  postgres:
    image: postgres:16-alpine
    container_name: maxemo_postgres
    environment:
      POSTGRES_USER: maxemo
      POSTGRES_PASSWORD: maxemo_secret
      POSTGRES_DB: learning_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxemo -d learning_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
