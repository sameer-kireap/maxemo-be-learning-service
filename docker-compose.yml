services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maxemo_be_service
    command: ["/app/docker-entrypoint.sh"]
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Learning Analytics Microservice
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://maxemo:maxemo_secret@postgres:5432/learning_analytics
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: maxemo_postgres
    environment:
      POSTGRES_USER: maxemo
      POSTGRES_PASSWORD: maxemo_secret
      POSTGRES_DB: learning_analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxemo -d learning_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
