[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names
# default: %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path so alembic can import our application code
prepend_sys_path = .

# Timezone for revision file date prefix
# timezone = UTC

# Version path separator for multi-tenancy (unused here)
version_path_separator = os

# sqlalchemy.url is overridden programmatically in env.py from app settings.
# This placeholder prevents alembic from failing when no URL is set.
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

[post_write_hooks]
# Run ruff format on every generated migration file
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
